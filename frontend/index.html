<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Big Data - Recomendações</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
        }

        .card-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 0.5rem;
            display: block;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .card-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--glass-border);
            padding-top: 1rem;
            font-size: 0.9rem;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #fbbf24;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent);
            margin-top: 2rem;
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Top Recomendações</h1>
        <p class="subtitle">Descobertos pelo Apache Spark • Buscados no OpenSearch</p>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar catálogo (OpenSearch Fuzzy Match)..." autocomplete="off">
        </div>

        <div id="loader" class="loader">Processando Big Data...</div>
        <div class="grid" id="productsGrid"></div>
    </div>

    <script>
        const grid = document.getElementById('productsGrid');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('searchInput');

        // Formata preço para BRL
        const formatPrice = (price) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(price);
        };

        // Cria o HTML do card
        const createCard = (product, index) => {
            return `
                <div class="card" style="animation-delay: ${index * 0.1}s">
                    <span class="card-category">${product.categoria} | ${product.marca}</span>
                    <h3 class="card-title">${product.nome}</h3>
                    <div class="card-price">${formatPrice(product.preco)}</div>
                    <p class="card-desc">${product.descricao}</p>
                    <div class="card-footer">
                        <span style="color: var(--text-muted)">Estoque: ${product.estoque}</span>
                        <div class="rating">
                            ★ ${product.avaliacao_media.toFixed(1)} <span style="color: var(--text-muted); font-size: 0.8rem">(${product.quantidade_avaliacoes})</span>
                        </div>
                    </div>
                </div>
            `;
        };

        // Busca as top recomendações do Spark
        const loadRecommendations = async () => {
            grid.innerHTML = '';
            loader.style.display = 'block';
            try {
                const response = await fetch('/recomendacoes');
                const data = await response.json();
                
                loader.style.display = 'none';
                
                if (data.recomendacoes && data.recomendacoes.length > 0) {
                    grid.innerHTML = data.recomendacoes.map((prod, i) => createCard(prod, i)).join('');
                } else {
                    grid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-muted)">Nenhuma recomendação encontrada.</p>';
                }
            } catch (error) {
                loader.style.display = 'none';
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#ef4444">Erro ao carregar dados da API. A API está rodando?</p>';
                console.error(error);
            }
        };

        // Realiza busca no OpenSearch
        const searchProducts = async (query) => {
            if (!query.trim()) {
                loadRecommendations();
                return;
            }

            grid.innerHTML = '';
            loader.style.display = 'block';
            try {
                const response = await fetch('/buscar?q=' + encodeURIComponent(query));
                const data = await response.json();
                
                loader.style.display = 'none';
                
                if (data.resultados && data.resultados.length > 0) {
                    grid.innerHTML = data.resultados.map((prod, i) => createCard(prod, i)).join('');
                } else {
                    grid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-muted)">Nenhum produto encontrado na busca.</p>';
                }
            } catch (error) {
                loader.style.display = 'none';
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#ef4444">Erro ao buscar no OpenSearch.</p>';
                console.error(error);
            }
        };

        // Debounce para a busca
        let timeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                searchProducts(e.target.value);
            }, 500);
        });

        // Carrega inicial
        loadRecommendations();
    </script>
</body>
</html>
